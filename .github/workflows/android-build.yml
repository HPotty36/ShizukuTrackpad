name: Android CI & APK Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    outputs:
      apk-name: ${{ steps.meta.outputs.apk_name }}

    steps:
      # Third-party actions are pinned to full commit SHAs (version in the comment).
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            echo "::error::sdkmanager not found at $SDK_MANAGER; cannot accept SDK licenses."
            exit 1
          fi
          # `yes` is killed by SIGPIPE once sdkmanager stops reading, so only sdkmanager's
          # own exit status should decide whether this step fails.
          set +o pipefail
          yes | "$SDK_MANAGER" --licenses > /dev/null

      - name: Resolve version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' must look like v1.2.3."
              exit 1
            fi
            echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
            echo "apk_name=ShizukuTrackpad-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      # ---- Branch / PR builds: debug APK as a workflow artifact only ----
      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ShizukuTrackpad-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ---- Tag builds: release APK signed with the persistent release key ----
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set; refusing to publish an unsigned release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          # run_number only grows, so every tagged release gets a higher versionCode.
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="${{ github.run_number }}"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload release APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ShizukuTrackpad-release-apk
          path: ${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Remove release keystore
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP/release.jks"

  release:
    name: Publish GitHub Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ShizukuTrackpad-release-apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.build-apk.outputs.apk-name }}
        run: |
          gh release create "$TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
